[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veriagent"
version = "0.2.0"
description = "Human-reviewed Boolean policies enforced on simulated MCP sharing"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pydantic==2.14.1", "python-sat==1.9.dev17", "sympy==1.14.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
desktop = ["PySide6-Essentials==6.12.0"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]

[tool.setuptools]
packages = ["veriagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
